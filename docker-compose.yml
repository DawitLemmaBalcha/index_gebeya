services:
  # 1. Database
  db:
    image: pgvector/pgvector:pg16
    container_name: suq_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - suq_postgres_data:/var/lib/postgresql/data

  # 2. API
  api:
    build: ./backend
    container_name: suq_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      GEMINI_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - suq_media_data:/app/media
    networks:
      - default
      - proxy-network

  # 3. Listener
  listener:
    build: ./listener
    container_name: suq_listener
    restart: always
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      - api
    volumes:
      - suq_media_data:/app/media

  # 4. Frontend
  frontend:
    build: ./frontend
    container_name: suq_frontend
    restart: always
    ports:
      - "3001:5173"
    networks:
      - default
      - proxy-network

networks:
  default:
    driver: bridge
  proxy-network:
    external: true

volumes:
  suq_postgres_data:
  suq_media_data:
